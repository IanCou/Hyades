services:
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    restart: always
    ports:
      - "80:80"
      - "9998:9998"
    environment:
      - NTFY_BASE_URL=https://ntfy.example.com
      - NTFY_LISTEN_HTTP=:80
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=24h
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT=1G
      - NTFY_ATTACHMENT_FILE_SIZE_LIMIT=15M
      - NTFY_METRICS_ENABLED=true
      - NTFY_METRICS_LISTEN_HTTP=:9998
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    volumes:
      - /data/ntfy/cache:/var/cache/ntfy
      - /data/ntfy/lib:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost/healthz -O - | grep -c ok || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
