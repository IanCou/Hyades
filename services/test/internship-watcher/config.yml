          - '(?i)deepmind'
          - '(?i)\bMeta\b'
          - '(?i)\bAmazon\b'
          - '(?i)\bDatabricks\b'
          - '(?i)Capital ?One'
          - '(?i)\bMicrosoft\b'
          - '(?i)\bApple\b'
          - '(?i)\bNetflix\b'
          - '(?i)\bNvidia\b'
          - '(?i)\bSalesforce\b'
          - '(?i)\bAirbnb\b'
          - '(?i)\bStripe\b'
          - '(?i)\bUber\b'
          - '(?i)\bLyft\b'
          - '(?i)\bPinterest\b'
          - '(?i)\bNotion\b'
          - '(?i)\bFigma\b'
          - '(?i)\bAnthropic\b'
          - '(?i)\bOpenAI\b'
          - '(?i)\bPalantir\b'
          - '(?i)\bSnowflake\b'
          - '(?i)\bCloudflare\b'
          - '(?i)\bDoorDash\b'
          - '(?i)\bRobinhood\b'
    template:
      title: "New grad match: {{ matched_keywords | join(', ') }}"
      body: |-
