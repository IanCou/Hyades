name: Sync Tailscale ACLs

# GitOps for the tailnet policy file (policy.hujson at repo root). See ADR 0007
# (docusaurus/docs/decisions/0007-tailscale-acl-route-scoping.md).
#   - PRs that touch policy.hujson run 'test': validates the policy against
#     the live tailnet without applying anything.
#   - Push to main runs 'apply': validates, then pushes the change live.
# Uses an OAuth client scoped to Policy File: Read+Write only (Trust
# credentials in the Tailscale admin console), not the fleet-wide admin key
# used nowhere in this repo.

on:
  push:
    branches: [main]
    paths: [policy.hujson]
  pull_request:
    paths: [policy.hujson]

permissions:
  contents: read

jobs:
  acls:
    # Runs only where the HOMELAB_RUNNER repo variable is set (the private source
    # repo). The public Hyades snapshot has no runner or secrets, so it skips.
    if: vars.HOMELAB_RUNNER == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test ACL
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test

      - name: Deploy ACL
        if: github.event_name == 'push'
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply
