# Deploy cobalt (API + web frontend + watchtower).
#
# Unlike the generic deploy.yml flow, this syncs the whole service directory
# (docker-compose.yml + Dockerfile.web) because the frontend has no upstream
# Docker image; it's built from source (see Dockerfile.web).
#
# Requires services/prod/cobalt/.env with API_URL, WEB_DEFAULT_API, WEB_HOST set.
#
# Usage:
#   ansible-playbook playbooks/cobalt.yml
---
- name: Deploy cobalt
  hosts: cobalt
  become: true

  vars:
    service_src: "{{ playbook_dir }}/../../services/prod/cobalt"
    deploy_dir: "/opt/services/cobalt"

  pre_tasks:
    - name: Fail if .env is missing locally
      ansible.builtin.stat:
        path: "{{ service_src }}/.env"
      delegate_to: localhost
      become: false
      register: env_file
      failed_when: not env_file.stat.exists

  tasks:
    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Sync service files
      ansible.builtin.copy:
        src: "{{ service_src }}/{{ item.name }}"
        dest: "{{ deploy_dir }}/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: "docker-compose.yml", mode: "0644" }
        - { name: "Dockerfile.web", mode: "0644" }
        - { name: ".env", mode: "0600" }

    - name: Build image and start stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        state: present
        remove_orphans: true
        pull: always
        build: always
