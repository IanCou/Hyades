# Bootstrap and configure the Raspberry Pi gateway host
#
# Configures systemd-resolved pre-flight and DNS (loopback AdGuard first,
# 1.1.1.1 fallback), enables kernel IP forwarding for Tailscale subnet routing,
# installs wakeonlan, and configures the wake-homelab script.
#
# Usage:
#   ansible-playbook playbooks/raspberrypi-setup.yml
#
# You can override the MAC addresses at runtime:
#   ansible-playbook playbooks/raspberrypi-setup.yml \
#     -e "node1_mac=AA:BB:CC:DD:EE:10 node2_mac=AA:BB:CC:DD:EE:11 node3_mac=AA:BB:CC:DD:EE:12"
---
- name: Setup Raspberry Pi Gateway
  hosts: gateways
  become: true

  vars:
    node1_mac: "a4:bb:6d:ae:76:d3"
    node2_mac: "a4:bb:6d:a1:c7:b2"
    node3_mac: "a4:bb:6d:ad:56:53"

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Stop and disable systemd-resolved (frees :53)
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      when:
        - "'systemd-resolved.service' in ansible_facts.services"
        - ansible_facts.services['systemd-resolved.service'].status | default('') != 'not-found'

    - name: Check whether resolv.conf is a symlink
      ansible.builtin.stat:
        path: /etc/resolv.conf
        follow: false
      register: resolv_conf

    - name: Remove resolv.conf symlink
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent
      when: resolv_conf.stat.islnk | default(false)

    - name: Check for openresolv configuration
      ansible.builtin.stat:
        path: /etc/resolvconf.conf
      register: resolvconf_config

    # openresolv prepends name_servers when dhcpcd regenerates resolv.conf.
    # Keep the fallback here too: DHCP may supply no additional nameservers.
    - name: Keep AdGuard first in regenerated resolv.conf
      ansible.builtin.lineinfile:
        path: /etc/resolvconf.conf
        regexp: '^#?\s*name_servers='
        line: 'name_servers="127.0.0.1 1.1.1.1"'
      when: resolvconf_config.stat.exists
      notify: Regenerate resolv.conf

    # openresolv otherwise suppresses non-local resolvers when loopback is present.
    - name: Keep public DNS fallback alongside local AdGuard
      ansible.builtin.lineinfile:
        path: /etc/resolvconf.conf
        regexp: '^#?\s*resolv_conf_local_only='
        line: resolv_conf_local_only=NO
      when: resolvconf_config.stat.exists
      notify: Regenerate resolv.conf

    - name: Read existing resolv.conf
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      when:
        - resolv_conf.stat.exists
        - not (resolv_conf.stat.islnk | default(false))
      register: existing_resolv_conf

    # Exit-node clients resolve through the host; loopback is the Pi's AdGuard.
    # 1.1.1.1 keeps the Pi resolving if AdGuard is down. A later resolvconf -u
    # preserves that order through name_servers, even without any DHCP resolvers.
    # Keep an already-correct generated file to avoid changes on every run.
    - name: Write static /etc/resolv.conf
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        mode: "0644"
        content: |
          nameserver 127.0.0.1
          nameserver 1.1.1.1
      when: >-
        not (
          resolvconf_config.stat.exists and
          existing_resolv_conf.content is defined and
          (existing_resolv_conf.content | b64decode).startswith('# Generated by resolvconf') and
          (
            existing_resolv_conf.content | b64decode |
            regex_findall('(?m)^nameserver\s+\S+')
          )[:2] == ['nameserver 127.0.0.1', 'nameserver 1.1.1.1']
        )

    - name: Enable IPv4 forwarding
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Enable IPv6 forwarding
      ansible.builtin.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        state: present
        reload: true

    - name: Install wakeonlan package
      ansible.builtin.apt:
        name: wakeonlan
        state: present
        update_cache: true

    - name: Create wake-homelab script
      ansible.builtin.copy:
        dest: /usr/local/bin/wake-homelab
        mode: "0755"
        content: |
          #!/bin/bash
          # MAC Addresses of Proxmox nodes (managed by Ansible)
          NODE1_MAC="{{ node1_mac }}"
          NODE2_MAC="{{ node2_mac }}"
          NODE3_MAC="{{ node3_mac }}"

          case "$1" in
            node1)
              wakeonlan $NODE1_MAC
              ;;
            node2)
              wakeonlan $NODE2_MAC
              ;;
            node3)
              wakeonlan $NODE3_MAC
              ;;
            all)
              wakeonlan $NODE1_MAC
              wakeonlan $NODE2_MAC
              wakeonlan $NODE3_MAC
              ;;
            *)
              echo "Usage: $0 {node1|node2|node3|all}"
              exit 1
              ;;
          esac

  handlers:
    - name: Regenerate resolv.conf
      ansible.builtin.command: resolvconf -u
      changed_when: true
