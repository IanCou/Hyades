# Deploy openclaw (self-hosted OpenClaw AI gateway, Claude API provider).
#
# Unlike the generic deploy.yml flow, this syncs the whole service directory
# (Dockerfile + openclaw.json) because openclaw is a built image, and copies
# .env for OPENCLAW_GATEWAY_TOKEN and ANTHROPIC_API_KEY.
#
# Requires services/test/openclaw/.env with OPENCLAW_GATEWAY_TOKEN and
# ANTHROPIC_API_KEY set (see .env.example)
# See docusaurus/docs/stack/openclaw.md.
#
# Usage:
#   ansible-playbook playbooks/openclaw.yml
---
- name: Deploy openclaw
  hosts: openclaw
  become: true

  vars:
    service_src: "{{ playbook_dir }}/../../services/test/openclaw"
    deploy_dir: "/opt/services/openclaw"

  pre_tasks:
    - name: Fail if .env is missing locally
      ansible.builtin.stat:
        path: "{{ service_src }}/.env"
      delegate_to: localhost
      become: false
      register: env_file
      failed_when: not env_file.stat.exists

    - name: Fail if ANTHROPIC_API_KEY is not set in .env
      ansible.builtin.command:
        cmd: grep -Eq '^ANTHROPIC_API_KEY=.+' "{{ service_src }}/.env"
      delegate_to: localhost
      become: false
      changed_when: false

  tasks:
    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Sync service files
      ansible.builtin.copy:
        src: "{{ service_src }}/{{ item.name }}"
        dest: "{{ deploy_dir }}/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: "docker-compose.yml", mode: "0644" }
        - { name: "Dockerfile", mode: "0644" }
        - { name: "openclaw.json", mode: "0644" }
        - { name: ".env", mode: "0600" }

    - name: Build image and start stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        state: present
        remove_orphans: true
        build: always
