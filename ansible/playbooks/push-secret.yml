# Push a service's secret .env to the CI runner
#
# Copies the gitignored services/<tier>/<service>/.env from the control host
# to /opt/github-runner/envs/<service>.env on the github-runner host, where the
# deploy workflow expects it. Codifies the manual scp step.
#
# Usage:
#   ansible-playbook playbooks/push-secret.yml -e service=searxng
#
# The .env is looked up under services/{core,prod,test}/<service>/.env; the
# first match wins. Fails if none exists locally.
---
- name: Push service secret to CI runner
  hosts: github-runner
  become: true

  vars:
    repo_services_dir: "{{ playbook_dir }}/../../services"
    runner_envs_dir: /opt/github-runner/envs

  tasks:
    - name: Locate the local .env across tiers
      ansible.builtin.stat:
        path: "{{ repo_services_dir }}/{{ tier }}/{{ service }}/.env"
      delegate_to: localhost
      become: false
      loop:
        - core
        - prod
        - test
      loop_control:
        loop_var: tier
      register: env_candidates

    - name: Select the matching .env
      ansible.builtin.set_fact:
        local_env_path: "{{ (env_candidates.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"

    - name: Fail if no .env was found locally
      ansible.builtin.fail:
        msg: >-
          No .env found for service '{{ service }}' under
          {{ repo_services_dir }}/{core,prod,test}/{{ service }}/.env on the control host.
      when: local_env_path | length == 0

    - name: Copy .env to the runner's envs directory
      ansible.builtin.copy:
        src: "{{ local_env_path }}"
        dest: "{{ runner_envs_dir }}/{{ service }}.env"
        owner: root
        group: root
        mode: "0600"
