# Deploy internship-watcher (github-watcher image).
#
# Unlike the generic deploy.yml flow, this also syncs config.yml and imports
# it into the running stack after startup; github-watcher upserts
# channels/watches by name, so re-running the import is safe.
#
# Requires services/test/internship-watcher/.env with GITHUB_TOKEN,
# NTFY_TOKEN, DISCORD_WEBHOOK_ID, DISCORD_WEBHOOK_TOKEN set.
#
# Usage:
#   ansible-playbook playbooks/internship-watcher.yml
---
- name: Deploy internship-watcher
  hosts: internship-watcher
  become: true

  vars:
    service_src: "{{ playbook_dir }}/../../services/test/internship-watcher"
    deploy_dir: "/opt/services/internship-watcher"

  pre_tasks:
    - name: Fail if .env is missing locally
      ansible.builtin.stat:
        path: "{{ service_src }}/.env"
      delegate_to: localhost
      become: false
      register: env_file
      failed_when: not env_file.stat.exists

  roles:
    - docker

  tasks:
    - name: Ensure service directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Sync service files
      ansible.builtin.copy:
        src: "{{ service_src }}/{{ item.name }}"
        dest: "{{ deploy_dir }}/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: "docker-compose.yml", mode: "0644" }
        - { name: "config.yml", mode: "0644" }
        - { name: ".env", mode: "0600" }

    - name: Pull image and start stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_dir }}"
        state: present
        remove_orphans: true
        pull: always

    - name: Wait for the app to answer healthz
      ansible.builtin.uri:
        url: "http://localhost:8000/healthz"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

    - name: Copy seed config into the running container
      ansible.builtin.command:
        cmd: docker compose cp config.yml internship-watcher:/app/config.yml
        chdir: "{{ deploy_dir }}"
      changed_when: true

    - name: Import seed config (idempotent upsert)
      ansible.builtin.command:
        cmd: docker compose exec -T internship-watcher github-watcher config import /app/config.yml
        chdir: "{{ deploy_dir }}"
      changed_when: true
