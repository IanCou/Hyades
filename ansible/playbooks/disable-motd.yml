# Disables the MOTD (message of the day) banner on all LXCs: both the
# static Debian legal boilerplate (/etc/motd) and the dynamic `uname` line
# (/run/motd.dynamic, regenerated by /etc/update-motd.d/10-uname). Comments
# out the pam_motd.so lines in /etc/pam.d/sshd and /etc/pam.d/login rather
# than emptying /etc/motd, since that's the single point PAM actually gates
# display through; covers both `ssh` and `pct enter`/console login, and
# survives /etc/motd being repopulated by a package update.
#
# Run: ansible-playbook playbooks/disable-motd.yml
---
- name: Disable MOTD on all LXCs
  hosts: all
  gather_facts: false

  tasks:
    - name: Comment out pam_motd.so in sshd PAM config
      ansible.builtin.replace:
        path: /etc/pam.d/sshd
        regexp: '^(session\s+optional\s+pam_motd\.so.*)$'
        replace: '# \1'

    - name: Comment out pam_motd.so in login PAM config
      ansible.builtin.replace:
        path: /etc/pam.d/login
        regexp: '^(session\s+optional\s+pam_motd\.so.*)$'
        replace: '# \1'
      ignore_errors: true # not every LXC template ships /etc/pam.d/login
