all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519

  children:
    # Proxmox hypervisor nodes
    proxmox_nodes:
      hosts:
        node1:
          ansible_host: 10.0.0.10
        node2:
          ansible_host: 10.0.0.11
        node3:
          ansible_host: 10.0.0.12

    # Legacy VMs: being migrated to LXCs, do not run deploy playbooks here
    legacy_vms:
      hosts:
        core-services:
          ansible_host: 10.0.0.20
        prod-services:
          ansible_host: 10.0.0.25
        test-services:
          ansible_host: 10.0.0.40

    # Docker hosts: new LXCs, one per compose stack
    docker_hosts:
      children:

        # Core infrastructure: 10.0.1.0/24, all on node1
        core:
          hosts:
            caddy:
              ansible_host: 10.0.1.10 # LXC 111
              service: caddy
              tier: core
            authentik:
              ansible_host: 10.0.1.11 # LXC 112
              service: authentik
              tier: core
            portainer:
              ansible_host: 10.0.1.12 # LXC 113
              service: portainer
              tier: core
            semaphore:
              ansible_host: 10.0.1.14 # LXC 115
              service: semaphore
              tier: core
            tailscale:
              ansible_host: 10.0.1.15 # LXC 116
              service: tailscale
              tier: core
            adguard:
              ansible_host: 10.0.1.16 # LXC 117
              service: adguard
              tier: core
            docs:
              ansible_host: 10.0.1.17 # LXC 118
              service: docs
              tier: core
            prometheus:
              ansible_host: 10.0.1.18 # LXC 119
              service: prometheus
              tier: core
            grafana:
              ansible_host: 10.0.1.19 # LXC 120
              service: grafana
              tier: core
            uptime-kuma:
              ansible_host: 10.0.1.20 # LXC 121
              service: uptime-kuma
              tier: core
            ntfy:
              ansible_host: 10.0.1.21 # LXC 122
              service: ntfy
              tier: core
            speedtest:
              ansible_host: 10.0.1.23 # LXC 124
              service: speedtest
              tier: core

        # Production services: 10.0.2.0/24, immich/nextcloud on node1, coolify on node3
        prod:
          hosts:
            immich:
              ansible_host: 10.0.2.10 # LXC 211
              service: immich
              tier: prod
            nextcloud:
              ansible_host: 10.0.2.11 # LXC 212
              service: nextcloud
              tier: prod
            coolify:
              ansible_host: 10.0.2.12 # LXC 213
              service: coolify
              tier: prod
            searxng:
              ansible_host: 10.0.2.13 # LXC 214
              service: searxng
              tier: prod
            airtrail:
              ansible_host: 10.0.2.16 # LXC 217
              service: airtrail
              tier: prod
            cobalt:
              ansible_host: 10.0.2.17 # LXC 218
              service: cobalt
              tier: prod
            kavita:
              ansible_host: 10.0.2.18 # LXC 219
              service: kavita
              tier: prod
            audiobookshelf:
              ansible_host: 10.0.2.19 # LXC 220
              service: audiobookshelf
              tier: prod
            appdev00:
              ansible_host: 10.0.2.20 # LXC 221
              service: appdev00
              tier: prod
            homeassistant:
              ansible_host: 10.0.2.22 # LXC 223
              service: homeassistant
              tier: prod

        # Test/staging services: 10.0.3.0/24, on node2
        test:
          hosts:
            n8n:
              ansible_host: 10.0.3.10 # LXC 601
              service: n8n
              tier: test
            internship-watcher:
              ansible_host: 10.0.3.11 # LXC 602
              service: internship-watcher
              tier: test
            kafka:
              ansible_host: 10.0.3.12 # LXC 603
              service: kafka
              tier: test
            openclaw:
              ansible_host: 10.0.3.13 # LXC 604
              service: openclaw
              tier: test
            dev:
              ansible_host: 10.0.3.14 # LXC 605
              service: dev
              tier: test

        # Always-on gateways/controllers
        gateways:
          hosts:
            raspberrypi:
              ansible_host: 10.0.0.3
              ansible_user: chaff

    # Ad-hoc QEMU VMs (qm create, not Terraform-managed): personal desktop use.
    # Sudo user "ian", not root, see AGENT.md's "Current QEMU VM inventory".
    desktop_vms:
      hosts:
        archvm00:
          ansible_host: 10.0.0.46 # VM 402, node2
          ansible_user: ian
        ubuntuvm00:
          ansible_host: 10.0.0.47 # VM 403, node3
          ansible_user: ian

    # CI/CD runner
    runners:
      hosts:
        github-runner:
          ansible_host: 10.0.1.13 # LXC 114, node1

    # Barebones SSH jump host: LAN-only, no docker, no service stack
    bastions:
      hosts:
        jump:
          ansible_host: 10.0.1.22 # LXC 123, node1
          tier: core

    # Hosts the CI deploy job must not target. Every ansible-playbook call in
    # ci.yml's deploy job runs with this group excluded (`!ci_deploy_skip`).
    # Run 39100257683 failed because node-exporter.yml hit all of docker_hosts
    # and 4 powered-off or unreachable hosts came back UNREACHABLE. Entries are
    # bare names: each host keeps its vars and its tier group above, so manual
    # runs like `ansible-playbook playbooks/deploy.yml -l immich` still work.
    ci_deploy_skip:
      children:
        # Empty on purpose. The deploy job fills it at run time from live
        # Proxmox power state (scripts/proxmox_power_state.py, loaded as a
        # second inventory source), so starting or stopping an LXC needs no
        # edit here. The Prometheus template also reads this group and leaves
        # its hosts out of scraping, so `up == 0` keeps meaning "broken"
        # instead of "parked". Manual runs without that fragment see it empty.
        stopped:
          hosts: {}
        # Running and scraped by Prometheus, but the self-hosted runner has no
        # SSH path to it, so a CI deploy can only ever fail there. Deploy to it
        # by hand from the LAN.
        ci_unreachable:
          hosts:
            raspberrypi:
