# Gitleaks configuration for this homelab repo.
# Extends the upstream default ruleset and layers on a repo-specific
# allowlist so that intentional placeholders and private (RFC1918)
# addresses do not produce false positives.
#
# Run locally with:  gitleaks detect --no-banner

# Inherit all of gitleaks' built-in rules.
[extend]
useDefault = true

[allowlist]
description = "Homelab false-positive allowlist"

# Files that legitimately contain placeholder credentials or non-secret data.
paths = [
  '''.*\.env\.example$''',   # every service ships .env.example with placeholders
  '''\.gitleaks\.toml$''',   # this config references example patterns
  '''SECURITY\.md$''',       # security docs may mention example tokens
]

# Obvious placeholder values used across .env.example files and docs.
regexes = [
  '''(?i)changeme''',
  '''(?i)your[-_]?(secret|token|key|password)[-_]?here''',
  '''(?i)example[-_]?(secret|token|key|password)''',
  '''(?i)<[^>]*(secret|token|key|password)[^>]*>''',
  '''(?i)placeholder''',
  # RFC1918 private addresses documented throughout the repo (not secrets).
  '''\b10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}\b''',
  '''\b192\.168\.(?:[0-9]{1,3})\.(?:[0-9]{1,3})\b''',
  '''\b172\.(?:1[6-9]|2[0-9]|3[01])\.(?:[0-9]{1,3})\.(?:[0-9]{1,3})\b''',
]

# Commits known to contain only placeholders/IPs could be listed here if needed.
stopwords = [
  "changeme",
  "example",
  "placeholder",
]
